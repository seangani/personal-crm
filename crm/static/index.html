<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom (the project's own)
 * paper: oklch(98.6% 0.004 85) · accent: oklch(48% 0.15 255) · display: system sans · body: system sans
 * nav: top bar, four tabs and one action · signature: the call list with its what-happened log · states: loading, empty, error, full
 * axes: warm paper/system/ink (neutral accent since 11/15) · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P3 H- E3 S3 R3 V4 · weakest: S, colour was spent on every number and pill; now colour marks only warm, paid and overdue, numbers and funnel share one panel, strategies a table */
/* Impeccable polish 10/29: mode operate · one summary panel · dates as text, overdue as the only date pill · no icons on section heads · themed scrollbars, caret, placeholder */
/* answered F7: inputs and buttons share one recipe on purpose, an input matches the button beside it (craft § 9) */
:root {
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --text-xs: 12px; --text-sm: 13px; --text-md: 15px; --text-lg: 17px; --text-xl: 20px; --text-2xl: 28px;
  --bg: oklch(98.6% 0.004 85); --panel: oklch(99.8% 0.003 85); --ink: oklch(23% 0.015 260); --muted: oklch(47% 0.015 260);
  --line: oklch(90.5% 0.006 85); --soft: oklch(95.6% 0.006 85);
  --accent: oklch(28% 0.015 260); --accent-ink: oklch(99% 0.004 85); --accent-bg: oklch(93.5% 0.006 85);
  --warn: oklch(52% 0.12 70); --warn-bg: oklch(95% 0.05 85); --ok: oklch(47% 0.11 160); --ok-bg: oklch(94.5% 0.04 160);
  --hot: oklch(54% 0.15 45); --hot-bg: oklch(95% 0.04 60); --dead: oklch(50% 0.17 27); --dead-bg: oklch(95.5% 0.03 25);
  --closed: oklch(55% 0.012 260); --focus: oklch(55% 0.17 255); --ai: oklch(50% 0.13 300); --ai-bg: oklch(95% 0.03 300); --st-other: oklch(52% 0.15 350);
  --scrim: oklch(15% 0.01 260 / 0.35); --shadow: 0 1px 2px oklch(15% 0.01 260 / 0.08); --shadow-lg: -8px 0 32px oklch(15% 0.01 260 / 0.18);
  --ease: 150ms ease; --container: 1200px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(18% 0.012 260); --panel: oklch(22% 0.014 260); --ink: oklch(93% 0.006 85); --muted: oklch(72% 0.012 260);
    --line: oklch(31% 0.014 260); --soft: oklch(26% 0.014 260);
    --accent: oklch(92% 0.006 85); --accent-ink: oklch(18% 0.012 260); --accent-bg: oklch(30% 0.012 260);
    --warn: oklch(82% 0.12 85); --warn-bg: oklch(31% 0.05 85); --ok: oklch(78% 0.12 160); --ok-bg: oklch(30% 0.05 160);
    --hot: oklch(78% 0.13 55); --hot-bg: oklch(31% 0.06 50); --dead: oklch(74% 0.14 25); --dead-bg: oklch(30% 0.06 25);
    --closed: oklch(66% 0.012 260); --focus: oklch(76% 0.13 255); --ai: oklch(78% 0.11 300); --ai-bg: oklch(30% 0.06 300); --st-other: oklch(76% 0.12 350);
    --scrim: oklch(5% 0.01 260 / 0.55); --shadow: 0 1px 2px oklch(5% 0.01 260 / 0.4); --shadow-lg: -8px 0 32px oklch(5% 0.01 260 / 0.5);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; }
::selection { background: var(--accent-bg); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
html { scrollbar-color: var(--line) transparent; accent-color: var(--accent); caret-color: var(--accent); }
::placeholder { color: var(--muted); opacity: 1; }
button, .btn, .card, .ov-row, .tab, .chip, .fstage, nav button, select, input, textarea { transition: background-color var(--ease), border-color var(--ease), color var(--ease); }
@media (prefers-reduced-motion: reduce) { *, .drawer, .toast { transition: none !important; } }
button, input, select, textarea { font: inherit; color: inherit; }
button:disabled, .btn:disabled, select:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
a { color: var(--accent); text-underline-offset: 0.16em; }
h1, h2, h3 { font-family: var(--font-display); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
.i { width: 16px; height: 16px; vertical-align: -3px; flex: none; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px max(20px, calc((100% - var(--container)) / 2 + 20px)); padding-top: max(12px, env(safe-area-inset-top));
  display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; }
select.ws { border: 0; background: transparent; font-weight: 650; font-size: var(--text-lg); padding: 0; cursor: pointer; }

nav button:hover { color: var(--ink); }
nav button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.grow { flex: 1; }
.viewpick { display: none; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 0 8px; min-width: 0; flex: 0 1 auto; }
#qbtn { display: none; }
input.search { flex: 0 1 280px; min-width: 140px; min-height: 36px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
  min-height: 36px; padding: 4px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }

.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--dead); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: var(--text-sm); }

  text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 0.2em; }
.link:hover { text-decoration-color: currentColor; }
.link:hover { text-decoration: underline; }
main { padding: 20px; max-width: var(--container); margin-inline: auto; }
.head { display: flex; align-items: baseline; gap: 8px; margin: 24px 0 8px; }

.pill.stuck .i { width: 12px; height: 12px; }
.pill.hot { background: var(--hot-bg); color: var(--hot); }
.pill.blue { background: var(--soft); color: var(--ink); }
.date { font-size: var(--text-sm); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.date.today { color: var(--ink); }
.date.late { color: var(--ink); font-weight: 600; }
.pill.paid { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.pill.dead { background: var(--soft); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
/* overview */
.section { margin-top: 40px; }
.section > .head:first-child { margin-top: 0; }
.summary { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: clip; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px; padding: 16px 20px; }
.kpi { min-width: 0; }
.kpi b { display: block; font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: var(--text-sm); }
.kpi.warm.has b, .kpi.hotn.has b { color: var(--hot); } .kpi.paid.has b { color: var(--ok); }
.funnel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(112px, 1fr); border-top: 1px solid var(--line); overflow-x: auto; }
.fstage { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 12px 20px; cursor: pointer; text-align: left; }
.fstage:first-child { border-left: 0; }
.fstage:hover { background: var(--soft); }

.fstage b { display: block; font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; }

.stable td.num, .stable th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stable tr[data-strat] { cursor: pointer; } .stable tr[data-strat]:hover td { background: var(--soft); }
.stable td { vertical-align: middle; }
.strats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.scard { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.scard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scard .top b { font-size: var(--text-lg); font-weight: 600; }

.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.scard dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: var(--text-sm); margin: 0; }
.scard dt { color: var(--muted); } .scard dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rows { border-top: 1px solid var(--line); }

.sbox:hover { border-color: var(--accent); }

.sbox dl { margin-top: 12px; }
.newcard { display: flex; align-items: center; justify-content: center; min-height: 160px; border-style: dashed; color: var(--accent); font-weight: 600; }

.pulse b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.pulse .hotn.has b { color: var(--hot); } .pulse .paidn.has b { color: var(--ok); }

.ai { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; color: var(--muted); flex: none; }
.ai .i { width: 14px; height: 14px; }
.ai.batch { background: var(--soft); color: var(--ink); }
.tdwho { display: inline-flex; gap: 4px; align-items: center; }
.tdstage { display: flex; flex-direction: column; gap: 4px; }
.stgd { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

.legend > span { display: inline-flex; gap: 4px; align-items: center; }
.who { display: flex; gap: 8px; align-items: center; min-width: 0; cursor: pointer; }
.who .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who:hover b { color: var(--accent); }
.warm { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: clip; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }

.tab:hover { background: var(--soft); }

  header { padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top)); gap: 8px; flex-wrap: wrap; } main { padding: 16px; }
  /* one row on phones: workspace, view picker, search and add as icons; search opens a row below */
  header { flex-wrap: wrap; } header .grow { display: none; } nav { display: none; } .viewpick { display: block; flex: 1 1 0; }
  select.ws { flex: 0 1 auto; min-width: 0; max-width: 40%; text-overflow: ellipsis; }
  #qbtn { display: inline-flex; } #add .addt { display: none; } #add, #qbtn { width: 44px; padding: 0; }
  input.search { display: none; order: 5; flex: 1 1 100%; } header.searching input.search { display: block; }
  .dhead { padding-inline: 16px; } .dbody { padding-inline: 16px; }
  .x { width: 44px; height: 44px; }
  .chips { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .chip { min-height: 44px; }
  .stp textarea { max-height: 240px; }
  .stp .h .t { white-space: normal; overflow-wrap: anywhere; }
  .stp.cur:not(.call) .acts { position: sticky; bottom: 0; z-index: 1; background: var(--panel); margin: 12px -12px 0; padding: 8px 12px; border-top: 1px solid var(--line); }
  .stp .h, .stepedit summary, .drawer .sub .link { min-height: 44px; }
  table .hide-sm { display: none; }
  .board { flex-direction: column; overflow-x: visible; gap: 8px; } .col { flex: none; width: 100%; max-height: none; } .col.none { display: none; }
  .card .mv, .card select.mvsel { min-height: 44px; } .selbox { padding: 12px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .ov-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who due" "nx dots"; gap: 4px 12px; padding: 12px 4px; }
  .ov-row .who { grid-area: who; } .ov-row .due { grid-area: due; } .ov-row .nx { grid-area: nx; } .ov-row .dots { grid-area: dots; justify-self: end; }
  .ov-row .stg { display: none; }
  .seq li { grid-template-columns: 56px minmax(0, 1fr); } .seq .counts { grid-column: 1 / -1; flex-wrap: wrap; gap: 8px 16px; }
  .wrow { grid-template-columns: minmax(0, 1fr) auto; } .wnext { grid-column: 1 / -1; justify-self: stretch; } .nxo { display: flex; max-width: 100%; } .wmeta { padding-left: 0; }
  .points { max-height: none; overflow: visible; }
  .session { grid-template-columns: minmax(0, 1fr); } .now { padding: 16px; } .tabs { flex-wrap: wrap; overflow-x: visible; } .tab { flex: 1 1 30%; min-width: 0; padding: 12px; } .tabpanel { padding: 4px 12px 12px; }
  .btn, input.callnote, .filters select, nav button, input.search, .drawer select.pick, .drawer input.pick, .box input, .stp input, .stp select, .btn.sm { min-height: 44px; }
  input, select, textarea { font-size: 16px; }
  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 12px 16px; }
  .fstage { padding: 12px 16px; }
  .stable .hide-sm { display: none; } .stable th, .stable td { padding: 8px 4px; }
  .srow { grid-template-columns: minmax(0, 1fr) 72px auto; } .srow .more { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>
<body>
<header>
  <select class="ws" id="ws" aria-label="Workspace"></select>
  <nav id="tabs">
    <button data-v="overview" class="on">Overview</button>
    <button data-v="board">Pipeline</button>
    <button data-v="all">Everyone</button>
    <button data-v="convo">Conversations</button>
    <button data-v="strategies">Strategies</button>
    <button data-v="outreach" hidden>Outreach today</button>
    <button data-v="analytics">Analytics</button>
    <button data-v="history">History</button>
  </nav>
  <select class="viewpick" id="viewpick" aria-label="View"></select>
  <div class="grow"></div>
  <button class="btn iconbtn" id="qbtn" type="button" aria-label="Search" aria-expanded="false" aria-controls="q"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5 -3.5"/></svg></button>
  <input class="search" id="q" placeholder="Search names, companies, emails, phones" type="search" aria-keyshortcuts="/">
  <button class="btn" id="add" type="button" aria-label="Add person"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="addt">Add person</span></button>
</header>
<p class="offline" id="offline" role="status" hidden>Can’t reach the CRM right now, so what you see may be out of date. It reconnects on its own.</p>
<main id="main"><div class="skeleton" aria-label="Loading your pipeline"><i></i><i></i><i></i><i></i></div>
<noscript><p class="empty">The CRM needs JavaScript turned on to show your pipeline.</p></noscript></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dname"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const inDays = n => new Date(Date.now() + n * 864e5).toLocaleDateString("en-CA");
const fmt = d => d ? new Date(d.slice(0,10) + "T12:00").toLocaleDateString("en-US", {month: "short", day: "numeric"}) : "";
const nat = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
const BLANK = "__blank__";

const ICONS = {
  email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6l9 -6"/>',
  call: '<path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/>',
  text: '<path d="M8 9h8M8 13h6M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3z"/>',
  linkedin: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 11v5M8 8v.01M12 16v-5M16 16v-3a2 2 0 0 0 -4 0"/>',
  meeting: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  task: '<path d="M9 11l3 3l8 -8"/><path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9"/>',
  close: '<circle cx="12" cy="12" r="9"/><path d="M10 10l4 4m0 -4l-4 4"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2l4 -4"/>',
  hot: '<path d="M12 12c2 -2.96 0 -7 -1 -8c0 3.04 -1.77 4.74 -3 6c-1.23 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.53 -1.06 -3.94 -2 -5c-1.79 3 -2.79 3 -4 2z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  wait: '<path d="M5 12h14M13 6l6 6l-6 6"/>',
  x: '<path d="M6 6l12 12M18 6l-12 12"/>',
  ai: '<path d="M12 3l1.9 5.1l5.1 1.9l-5.1 1.9l-1.9 5.1l-1.9 -5.1l-5.1 -1.9l5.1 -1.9z"/><path d="M18 15l.8 2.2l2.2 .8l-2.2 .8l-.8 2.2l-.8 -2.2l-2.2 -.8l2.2 -.8z"/>',
  building: '<path d="M4 21v-15a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v15"/><path d="M16 9h2a2 2 0 0 1 2 2v10M3 21h18M8 8h4M8 12h4M8 16h4"/>',
  alert: '<path d="M12 4l9 16h-18z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  pin: '<path d="M12 21s-6 -5.4 -6 -10.5a6 6 0 1 1 12 0c0 5.1 -6 10.5 -6 10.5z"/><circle cx="12" cy="10.5" r="2"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.task}</svg>`;
const TYPES = { email: "Email", call: "Call", text: "Text", linkedin: "LinkedIn", meeting: "Meeting", task: "To do", close: "Close if no reply" };
const DUE = [["", "Any due date"], ["now", "Due now"], ["week", "Due within 7 days"], ["none", "No next step"], ["stuck", "Warm leads stuck over 4 days"], ["stuckall", "Anyone stuck over 4 days"]];
const noFilters = () => ({ stage: "", due: "", strategy: "", custom: {} });

let state = { ws: null, view: "overview", board: null, workspaces: [], f: noFilters(), sort: { key: "updated", dir: -1 },
  allEmails: false, warmTab: "close", pick: "", pickNote: "", session: null, stratOpen: null, open: new Set(), sel: new Set(), colAll: new Set() };
try { state.view = localStorage.getItem("crm.view") || "overview"; state.warmTab = localStorage.getItem("crm.warmTab") || "close"; } catch (e) {}
if (state.view === "today") state.view = "overview";
const curWs = () => state.workspaces.find(w => w.slug === state.ws);
const stageInfo = () => Object.fromEntries(state.board.stages.map(s => [s.name, s]));

async function api(path, opts = {}) {
  const write = opts.method && opts.method !== "GET";
  let r;
  try { r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined }); }
  catch (e) {
    offline(true);
    toast(write ? "Couldn't reach the CRM, so that wasn't saved. It usually restarts within a minute, so try again then." : "Couldn't reach the CRM. Try again in a minute.", null, true);
    throw e;
  }
  offline(false);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const why = data.error || (r.status >= 500 ? "The CRM hit an error" : "That didn't work");
    toast(write ? `${why}. Nothing was changed, so you can try again.` : why, null, true); throw new Error(why);
  }
  return data;
}
// a quiet line under the header while the CRM can't be reached, so stale numbers don't pass for live ones
function offline(on) { const el = $("#offline"); if (el) el.hidden = !on; }
function toast(msg, undo, err) {
  const t = $("#toast"); t.textContent = msg; t.classList.toggle("act", !!undo);
  if (undo) {
    const b = document.createElement("button"); b.type = "button"; b.className = "tundo"; b.textContent = "Undo";
    b.onclick = async () => { t.classList.remove("on"); await undo(); }; t.append(" ", b);
  }
  t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), undo || err ? 6000 : 2000);
}
// asks in place, next to what's being changed, instead of a browser dialog; resolves true or false
function askInline(anchor, msg, yes = "Yes") {
  return new Promise(res => {
    document.querySelector(".inask")?.dispatchEvent(new Event("cancel"));
    const box = document.createElement("div"); box.className = "inask"; box.setAttribute("role", "alert");
    box.innerHTML = `<span>${esc(msg)}</span><button class="btn sm danger" type="button">${esc(yes)}</button><button class="link" type="button">Cancel</button>`;
    const end = v => { box.remove(); res(v); };
    const [go, no] = box.querySelectorAll("button");
    go.onclick = () => end(true); no.onclick = () => end(false);
    box.addEventListener("cancel", () => end(false));
    box.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); end(false); } };
    anchor.insertAdjacentElement("afterend", box); go.focus();
  });
}

// filters and sort are remembered per workspace
function loadPrefs() {
  let p = {}; try { p = JSON.parse(localStorage.getItem("crm.prefs." + state.ws) || "{}"); } catch (e) {}
  state.f = { ...noFilters(), ...p.f }; state.sort = p.sort || { key: "updated", dir: -1 };
}
function savePrefs() { try { localStorage.setItem("crm.prefs." + state.ws, JSON.stringify({ f: state.f, sort: state.sort })); } catch (e) {} }

// custom fields worth a filter: ones with a handful of distinct values, like Batch
const shownFields = () => curWs().fields.filter(f => !f.hide);
function customOptions() {
  return shownFields().map(fd => ({ name: fd.name, vals: [...new Set(state.board.contacts
      .map(c => c.custom?.[fd.name]).filter(v => v != null && v !== "").map(String))].sort(nat) }))
    .filter(o => o.vals.length && o.vals.length <= 40);
}
// drop saved filters that no longer match anything selectable, so a hidden filter never empties the list
function cleanFilters() {
  const f = state.f;
  if (f.stage && f.stage[0] !== "@" && !state.board.stages.some(s => s.name === f.stage)) f.stage = "";
  if (f.strategy && f.strategy !== "none" && !state.board.strategies.some(s => String(s.id) === f.strategy)) f.strategy = "";
  const opts = Object.fromEntries(customOptions().map(o => [o.name, o.vals]));
  for (const [k, v] of Object.entries(f.custom)) if (v && !(opts[k] && (v === BLANK || opts[k].includes(v)))) delete f.custom[k];
}
function filtered(skipStage, skipDue) {
  const f = state.f, t = today(), week = inDays(7), st = stageInfo();
  const names = Object.fromEntries(state.board.strategies.map(s => [String(s.id), s.name]));
  return state.board.contacts.filter(c => {
    if (f.stage && !skipStage) {
      const k = st[c.stage]?.kind;
      if (f.stage === "@live") { if (!["open", "active"].includes(k)) return false; }
      else if (f.stage === "@hot") { if (!st[c.stage]?.hot) return false; }
      else if (f.stage[0] === "@") { if (k !== f.stage.slice(1)) return false; }
      else if (c.stage !== f.stage) return false;
    }
    if (f.strategy && (f.strategy === "none" ? c.strategy : c.strategy !== names[f.strategy])) return false;
    for (const [k, v] of Object.entries(f.custom)) {
      const cv = String(c.custom?.[k] ?? "");
      if (v && (v === BLANK ? cv !== "" : cv !== v)) return false;
    }
    if (!skipDue) {
      const d = c.next_due;
      if (f.due === "now" && !(c.next_step && d && d <= t)) return false;
      if (f.due === "week" && !(c.next_step && d && d <= week)) return false;
      if (f.due === "none" && c.next_step) return false;
      if (f.due === "stuck" && !isStuck(c)) return false;
      if (f.due === "stuckall" && !c.stale_days) return false;
    }
    return true;
  });
}
function sorted(rows) {
  const { key, dir } = state.sort;
  const order = Object.fromEntries(state.board.stages.map((s, i) => [s.name, i]));
  const val = c => key === "stage" ? order[c.stage] ?? 999 : key === "person" ? (c.person || c.company)
    : key.startsWith("c:") ? c.custom?.[key.slice(2)] : c[key];
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b), ex = x == null || x === "", ey = y == null || y === "";
    if (ex || ey) return ex - ey; // blanks always last
    return (typeof x === "number" ? x - y : nat(x, y)) * dir;
  });
}
function filterBar({ stage = true, due = true } = {}, shown) {
  const f = state.f, total = state.board.contacts.length;
  const sel = (key, opts, val) => `<select data-f="${esc(key)}" class="${val ? "set" : ""}">${opts.map(([v, l]) =>
    `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const parts = [];
  if (stage) parts.push(sel("stage", [["", "All stages"], ["@hot", "Hot"], ["@live", "Still in play"], ["@won", "Won"], ["@closed", "Closed"],
    ...state.board.stages.map(s => [s.name, s.name])], f.stage));
  if (state.board.strategies.length) parts.push(sel("strategy", [["", "All strategies"],
    ...state.board.strategies.map(s => [String(s.id), s.name]), ["none", "No strategy"]], f.strategy));
  for (const o of customOptions()) parts.push(sel("c:" + o.name, [["", `Any ${o.name.toLowerCase()}`],
    ...o.vals.map(v => [v, v]), [BLANK, `No ${o.name.toLowerCase()}`]], f.custom[o.name] || ""));
  if (due) parts.push(sel("due", DUE, f.due));
  const any = (stage && f.stage) || (due && f.due) || f.strategy || Object.values(f.custom).some(Boolean);
  return `<div class="filters">${parts.join("")}<span class="count">${shown === total ? `${total} people` : `${shown} of ${total} people`}</span>
    ${any ? `<button class="link" id="clearF">Clear filters</button>` : ""}</div>`;
}

const dayName = d => new Date(d + "T12:00").toLocaleDateString("en-US", { weekday: "short" });
// the next Saturday, or today when it's already Saturday or Sunday (dates as YYYY-MM-DD)
function weekendOf(t) { const d = new Date(t + "T12:00"), w = d.getDay(); if (w && w < 6) d.setDate(d.getDate() + 6 - w); return d.toLocaleDateString("en-CA"); }
function duePill(d, hasStep = true, weekend = false) {
  if (!d) return hasStep ? `<span class="pill">No date</span>` : "";
  const t = today();
  // a weekend call due Saturday is still on time on Sunday
  if (weekend) {
    const sat = new Date(t + "T12:00").getDay() === 0 ? inDays(-1) : weekendOf(t);
    if (d >= sat && d <= t) return `<span class="date today">This weekend</span>`;
    if (d > t) return `<span class="date">Weekend, ${dayName(d)} ${fmt(d)}</span>`;
  }
  // most of the pipeline is overdue at any time, so this is bold text, not an amber pill on every card (DESIGN.md Scarcity rule)
  if (d < t) return `<span class="date late">Overdue since ${fmt(d)}</span>`;
  if (d === t) return `<span class="date today">Today</span>`;
  return `<span class="date">${fmt(d)}</span>`;
}
// the step dots: one per step in their plan, colored by type (email blue, call green, close grey, the rest pink),
// filled for the ones behind them, the current one bigger, paused dashed, skipped faint
const DOT_STATE = { done: "f", skipped: "s", paused: "p", planned: "" };
const dotType = t => ["email", "call", "close"].includes(t) ? t : "other";
function dots(c) {
  const p = c.progress || {}, steps = p.steps || [], past = (p.done || 0) + (p.skipped || 0), n = steps.length;
  // hover a dot to see what it is: "Call #2, next up" (numbered within its type, so Email #1, Call #1, Email #2 ...)
  const seen = {}, STATUS_WORD = { done: "done", skipped: "skipped", paused: "paused", planned: "planned" };
  const out = steps.map(([type, status], i) => {
    const k = TYPES[type] || type, num = seen[k] = (seen[k] || 0) + 1, at = i === past && status === "planned";
    const tip = type === "close" ? `${k}, ${at ? "next up" : STATUS_WORD[status] || status}` : `${k} #${num}, ${at ? "next up" : STATUS_WORD[status] || status}`;
    return `<i class="${dotType(type)} ${at ? "at" : DOT_STATE[status] ?? ""}" title="${esc(tip)}"></i>`;
  });
  if (stageInfo()[c.stage]?.kind === "closed") {
    const label = `Closed: ${c.stage}${n ? `, after ${p.done} of ${n} steps` : ""}`;
    return `<span class="dots dead" role="img" aria-label="${esc(label)}" title="${esc(label)}">${steps.map(() => "<i></i>").join("")}<i class="end"></i></span>`;
  }
  if (!n) return "";
  const cur = c.current, kind = cur ? TYPES[cur.type] || cur.type : "";
  const label = p.planned ? `Step ${past + 1} of ${n}: ${cur.label && !cur.label.startsWith(kind) ? `${kind}, ${cur.label}` : cur.label || kind}`
    : p.paused ? `${past} of ${n} steps done, ${p.paused} paused` : `All ${n} steps done`;
  return `<span class="dots" role="img" aria-label="${esc(label)}" title="${esc(label)}">${out.join("")}</span>`;
}
const dotLegend = `<div class="legend" aria-label="Step dot shapes"><span class="dots"><i class="email f"></i></span>Email<span class="dots"><i class="call f"></i></span>Call
  <span class="dots"><i class="other f"></i></span>Text, LinkedIn, meeting, to do<span class="dots"><i class="close f"></i></span>Close if no reply</div>`;
function nextText(c) {
  const s = c.current;
  if (!s) return `<span class="muted">${c.progress?.paused ? "Paused, needs a next step" : "No next step"}</span>`;
  const phone = c.phone || c.custom?.Mobile;
  const detail = s.type === "email" && s.subject && !s.label.includes(s.subject) ? `${s.label}: ${s.subject}` : s.label;
  return `${icon(s.type)}<span>${esc(detail)}</span>${s.type === "call" && phone ? `<span class="muted">${esc(phone)}</span>` : ""}`;
}
// stage colors: paid green, warm orange, closed red, in-progress blue, not started gray
function stageClass(name) {
  const s = stageInfo()[name] || {};
  return s.paid ? "paid" : s.hot ? "hot" : s.kind === "closed" ? "dead" : s.kind === "active" ? "blue" : "";
}
function stagePill(c) { return `<span class="pill ${stageClass(c.stage)}">${esc(c.stage)}</span>`; }
// Sean's rule: nobody sits in one stage over 4 days. The server works it out (won, closed and held people never get it)
// the warning shows on warm leads only (Sean, 11/15): on cold stages it flagged 363 of 442 people and stopped meaning anything
// replies get the warm tint only when the person is warm by choice: Replied is where every reply lands automatically, a "no" included
const warmTint = c => !!stageInfo()[c.stage]?.hot && c.stage !== "Replied";
const isStuck = c => !!c.stale_days && !!stageInfo()[c.stage]?.hot;
const stuckTag = (c, long) => isStuck(c) ? `<span class="pill stuck" title="${esc(`In ${c.stage} for ${c.stale_days} days. Move them on, or set a hold date in their panel.`)}">${icon("alert")}${long
  ? `Stuck ${c.stale_days} days in ${esc(c.stage)}` : `${c.stale_days} days in stage`}</span>` : "";
// the outcome buttons; Make Loom took Call back later's place (Sean, 11/13), which still names older log entries
const CALL_LOG = [["no_answer", "No answer"], ["voicemail", "Left a voicemail"], ["gatekeeper", "Reached gatekeeper"],
  ["loom", "Make Loom"], ["interested", "Interested"], ["maybe", "Lukewarm, wants an email"], ["rejected", "Not interested"], ["talked", "Talked, other"]];
const outcomeName = o => (CALL_LOG.find(y => y[0] === o) || { call_back: [o, "Call back later"] }[o])?.[1] || o;
function row(c) {
  return `<div class="ov-row" data-id="${c.id}">
    <div class="who">${aiMark(c)}<span class="nm"><b>${esc(c.person || c.company)}</b>${c.person ? `<span class="co">${esc(c.company)}</span>` : ""}</span></div>

// ---- conversations: each warm lead's whole back-and-forth as one thread ----------------------------------
// warm or recently live: any warm stage (Call back, Replied, Interested and on), Not now, or Priority FOCUS/HOT; never closed
const CONVO_STAGES = new Set(["Not now"]);

  const info = stageInfo();

    (info[c.stage]?.hot || CONVO_STAGES.has(c.stage) || /^(focus|hot)/i.test(priorityOf(c))))
    .sort((a, b) => need(a) - need(b) || ((b.last_touch || "") < (a.last_touch || "") ? -1 : (b.last_touch || "") > (a.last_touch || "") ? 1 : 0));
}
// what needs you first: no next step, then overdue, then due today, then the rest (newest contact first within each)
const need = c => !c.current ? 0 : c.current.due && c.current.due < today() ? 1 : c.current.due === today() ? 2 : 3;

function convoRow(c) {
  const pr = priorityOf(c), badge = /^(focus|hot)/i.test(pr) ? `<span class="pill hot">${icon("hot")}${esc(pr.split(/\s/)[0].toUpperCase())}</span>` : "";

      <span>${c.last_touch ? `Last: ${esc(lowerKind(c.last_kind))} ${fmt(c.last_touch)}` : "No contact yet"}</span>${nx ? `<span>${esc(nx)}</span>` : `<span class="nonx">No next step</span>`}</span></button>`;

function convoItem(t) {
  const when = `${fmt(t.at)}${t.at.length > 10 ? `, ${clock(t.at)}` : ""}`;
  if (t.kind === "stage") return `<div class="sdiv">${esc(t.summary)}, ${fmt(t.at)}</div>`;
  const body = (t.detail || "").trim(), open = state.convoOpen.has(t.id);
  const text = (txt) => {
    const long = txt.split("\n").length > 3 || txt.length > 260;
    return `<p class="mb${long && !open ? " clamp" : ""}">${esc(txt)}</p>${long ? `<button class="link" type="button" data-cexp="${t.id}">${open ? "Show less" : "Show all"}</button>` : ""}`;
  };

      ${t.subject ? `<div class="ms">${esc(t.subject)}</div>` : ""}${body ? text(body) : `<p class="mb">${esc(t.summary)}</p><p class="nofull">Full email not saved yet</p>`}</div>`;
  }

      ${t.subject ? `<div class="ms">${esc(t.subject)}</div>` : ""}${text(txt || t.summary)}${body ? "" : `<p class="nofull">Short version, their full reply isn't saved yet</p>`}</div>`;
  }

function pinnedStep(c) {

async function renderConvo() {

// ---- history: every change to a person, who made it, and undo -------------------------------------------

const SPAN = [["0", "Today"], ["1", "Yesterday"], ["7", "Last 7 days"], ["30", "Last 30 days"]];
if (!state.hist) state.hist = { who: "", span: "0" };
function histRange() {

async function renderHistory(rows) {

// ---- outreach today: the automatic daily email send (the outreach chat's script says how it's going) -------
const clock = iso => iso ? new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "";
const SEND_GAP = 45;  // seconds between sends
function outreachState(o) {
  const last = o.lists?.map(l => l.last_sent).filter(Boolean).sort().pop();
  return ({
    waiting: ["", "Waiting for 9 AM, or for the laptop to wake up"],
    sending: ["sending", "Sending now"],
    stalled: ["stopped", "Sending, but the status hasn't updated in over 2 minutes. Check the Terminal window."],
    done: ["done", `Done${last ? ` at ${clock(last)}` : ""}`],
    stopped: ["stopped", "Stopped: Outlook and Mail aren't responding. The send log says what happened."],
    weekend: ["", "Weekend: no sends today"],
    nothing_due: ["done", "Nothing due today"],
  })[o.state] || ["stopped", o.error || "Couldn't read today's send"];
}
async function renderOutreach(o) {
  if (!o) {

    try { o = await api("/api/outreach-today"); } catch (e) { o = { state: "unavailable", error: "Couldn't reach the CRM" }; }

  }
  if (o.state === "unavailable") {
    $("#main").innerHTML = `<div class="section"><div class="head"><h2>Outreach today</h2></div>
      <div class="obox stopped"><p class="ostate">Can't show today's send right now</p><p class="muted note">${esc(o.error || "")}</p></div></div>`;
    return;
  }
  const [cls, words] = outreachState(o), total = o.total || 0, sent = o.sent || 0;
  const times = (o.lists || []).flatMap(l => [l.first_sent, l.last_sent]).filter(Boolean).sort();
  const first = times[0], last = times[times.length - 1];
  let eta = "";
  if (o.state === "sending" && total > sent) {
    const from = Math.max(last ? Date.parse(last) : 0, Date.now());
    eta = clock(new Date(from + (total - sent) * SEND_GAP * 1000).toISOString());
  }
  const facts = [first && ["Started", clock(first)], last && ["Last send", clock(last)], eta && ["Done by about", eta],
    o.tries > 1 && o.state !== "done" && ["Tries", `${o.tries} of 3`]].filter(Boolean);
  const people = (o.lists || []).map(l => `<div class="section"><div class="head"><h2>${esc(l.label)}</h2><span class="n">${l.sent} of ${l.total}</span></div>
    <div class="rows">${l.people.map(p => `<div class="orow${p.sent_at ? "" : " queued"}"${p.id ? ` data-id="${p.id}"` : ""}>
      <span class="nm"><b>${esc(p.person || p.name || p.email)}</b><span class="co">${esc(p.company)}</span></span>
      <span class="${p.sent_at ? "" : "muted"}">${p.sent_at ? clock(p.sent_at) : "Queued"}</span></div>`).join("")}</div></div>`).join("");
  const days = (o.upcoming || []).map(d => `<div class="oday${d.bumps ? "" : " none"}"><b>${d.bumps}</b><span>${new Date(d.date + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}</span></div>`).join("");
  $("#main").innerHTML = `<div class="section"><div class="head"><h2>Outreach today</h2><div class="grow"></div><span class="muted">${esc(o.window || "")}</span></div>
    <div class="obox ${cls}">

      <div class="otrack" role="progressbar" aria-label="Emails sent today" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${sent}"><i style="transform: scaleX(${total ? sent / total : 0})"></i></div>
      <p class="ostate">${esc(words)}</p>
      ${facts.length ? `<dl class="ofacts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
    </div></div>
    ${days ? `<div class="section"><div class="head"><h2>Next 5 weekdays</h2><div class="grow"></div>
      <span class="muted">${o.bumps_waiting ?? 0} ${o.bumps_waiting === 1 ? "person is" : "people are"} still owed a bump</span></div>
      <div class="odays">${days}</div><p class="muted note">Bumps expected each weekday, ${o.per_day || 50} a day at most. When these hit zero, the bump backlog is used up.</p></div>` : ""}

}

    <span class="o${WARM_OUT.has(x.outcome) ? " warmo" : ""}">${esc(outcomeName(x.outcome))}${x.note ? `: ${esc(x.note)}` : ""}${x.moved ? `. Now ${esc(x.moved)}` : ""}</span></li>`).join("")
    || `<li class="muted">Each call you log shows up here, with undo.</li>`;
  if (!c && !ses.log.length) return `<p class="muted nocalls">${plan?.plan ? "No calls left in today's plan." : "No calls due today. New ones show up here on the day they're due."}</p>${others}`;
  return `${total ? `<div class="progress"><span>${ses.log.length} of ${total} logged</span><div class="track" aria-hidden="true"><i style="transform:scaleX(${total ? ses.log.length / total : 0})"></i></div>

async function logSessionCall() {
  const card = $(".now[data-step]");
  if (!card || !state.pick) return;
  const cid = Number(card.dataset.cid), step = Number(card.dataset.step), c = state.board.contacts.find(x => x.id === cid);
  const note = $("#callNote").value.trim(), outcome = state.pick;
  $("#logNext").disabled = true;
  try {
    const r = await api(`/api/steps/${step}/done`, { method: "POST", body: { outcome, note } });
    const ses = loadSession();
    ses.log.push({ step, cid, name: c.person || c.company, outcome, note, moved: r.stage !== c.stage ? r.stage : "", email: r.after_call_step || 0, block: planOf(c)?.block || 0 });
    ses.skipped = ses.skipped.filter(id => id !== cid);
    saveSession(); state.pick = ""; state.pickNote = "";
    toast(outcome === "loom" ? "Call logged. “Record and send a Loom” is now on today's list" : r.stage !== c.stage ? `Logged, moved to ${r.stage}` : "Call logged");
    await load();
    if (r.after_call_step) openEmail(cid, r.after_call_step);
  } catch (e) { $("#logNext").disabled = false; }
}

function openEmail(cid, sid) { state.openFor = Number(cid); state.open = new Set([Number(sid)]); openContact(cid); }
async function undoSessionCall(step) {
  const ses = loadSession(), i = ses.log.findIndex(x => x.step === step);
  try {

    if (i >= 0) ses.log.splice(i, 1);

}

function renderOverview() {
  const st = stageInfo(), t = today(), stages = state.board.stages;
  const list = filtered(true, true);
  const kind = c => st[c.stage]?.kind;
  const done = c => ["won", "closed"].includes(kind(c));
  // the money part of the pipeline: Interested and everything after it, up to the won stage
  const iInt = stages.findIndex(s => s.name === "Interested");
  const afterNames = new Set(stages.slice(Math.max(iInt, 0)).filter(s => s.kind !== "closed").map(s => s.name));
  const warm = list.filter(c => st[c.stage]?.hot || kind(c) === "won");
  const has = n => n ? " has" : "";
  const paid = list.filter(c => st[c.stage]?.paid).length, dead = list.filter(c => kind(c) === "closed").length;
  const interested = list.filter(c => afterNames.has(c.stage)).length, stuck = list.filter(isStuck).length;
  const dueNow = c => !done(c) && c.current?.due && c.current.due <= t;
  // calls and emails are the cold outreach; warm people live in the warm panel with their next outreach
  const cold = c => dueNow(c) && !st[c.stage]?.hot;
  // a call plan for today (steps titled like "Fri call, Block 1 (9 AM-12 ET) #04: Close") replaces the overdue pile,
  // warm people included, in block then number order; the rest stay one click away
  const coldCalls = byDue(list.filter(c => cold(c) && c.current.type === "call"));
  const plan = list.filter(c => !done(c) && c.current?.due === t && planOf(c))
    .sort((a, b) => planOf(a).block - planOf(b).block || planOf(a).n - planOf(b).n);
  const planDay = plan.length > 0 || loadSession().log.some(x => x.block);
  const planIds = new Set(plan.map(c => c.id)), rest = coldCalls.filter(c => !planIds.has(c.id));
  // today = the plan, or calls due today; the backlog = older overdue calls, one click away instead of 300+ in the count
  const todays = planDay ? plan : coldCalls.filter(c => c.current.due === t);
  const backlog = planDay ? rest : coldCalls.filter(c => c.current.due < t);
  const calls = [...todays, ...(state.allCalls ? backlog : [])];
  const emails = byDue(list.filter(c => cold(c) && c.current.type === "email"));
  // due today: meetings (late ones too, an unlogged meeting shouldn't vanish), warm people's steps, and other cold to-dos,
  // so nothing due today hides inside the warm tabs while the calls card says there's nothing to do
  const inCalls = new Set(todays.map(c => c.id)), TODAY_ORDER = { meeting: 0, call: 1, email: 2 };
  const dueToday = list.filter(c => !done(c) && c.current?.due && !inCalls.has(c.id) &&
      (c.current.type === "meeting" ? c.current.due <= t : c.current.due === t && (st[c.stage]?.hot || !["call", "email"].includes(c.current.type))))
    .sort((a, b) => (TODAY_ORDER[a.current.type] ?? 3) - (TODAY_ORDER[b.current.type] ?? 3) || (a.current.due < b.current.due ? -1 : 1));
  const todayIds = new Set(dueToday.map(c => c.id));
  const other = byDue(list.filter(c => cold(c) && !["call", "email"].includes(c.current.type) && !todayIds.has(c.id)));
  const shownEmails = state.allEmails ? emails : emails.slice(0, 8), inBatch = emails.filter(c => c.ai_state === "batch").length;

  const strip = `<p class="pulse"><span class="hotn${has(warm.length)}"><b>${warm.length}</b> warm</span>, <b>${interested}</b> interested or further,
    <span class="paidn${has(paid)}"><b>${paid}</b> at a paid stage</span>, <b>${dead}</b> dead.
    ${stuck ? `<button class="link" type="button" data-stuckgo>${stuck} warm ${stuck === 1 ? "lead" : "leads"} stuck over 4 days</button>` : ""}</p>`;
  const warmSec = `<div class="section"><div class="head"><h2>Warm leads</h2><div class="grow"></div>${dotLegend}${aiLegend}</div>${warmPanel(warm, list)}</div>`;
  const sat = weekendOf(t), sun = new Date(new Date(sat + "T12:00").getTime() + 864e5).toLocaleDateString("en-CA");
  const wkCalls = list.filter(c => !done(c) && c.current?.type === "call" && c.current.weekend && c.current.due > t && c.current.due <= sun).length;
  const wkNote = wkCalls ? `<span class="muted">${wkCalls} weekend ${wkCalls === 1 ? "call" : "calls"} for Sat ${fmt(sat)}</span>` : "";
  const callSec = `<div class="section" id="calls"><div class="head"><h2>${planDay ? "Today's plan" : "Calls today"}</h2><span class="n">${todays.length}</span><div class="grow"></div>${wkNote}</div>${callSession(calls, { others: backlog.length, plan: planDay })}</div>`;
  // one list for everything else to reach today (critique 11/16): it replaced Due today, Emails to send, Other things due
  // and the Strategies table (that lives on the Strategies tab). The call sheet stays its own box
  const group = (title, rows, extra = "") => rows.length ? `<h3 class="sh">${title}<span class="n">${rows.length}</span></h3>${extra}<div class="rows">${rows.map(row).join("")}</div>` : "";
  const reachN = dueToday.length + emails.length + other.length;
  const reachSec = `<div class="section" id="today"><div class="head"><h2>Reach today</h2><span class="n">${reachN}</span></div>
    ${reachN ? group("Due today", dueToday)
      + group("Emails to send", shownEmails, inBatch ? `<p class="muted note">${inBatch} of these ${inBatch === 1 ? "is" : "are"} already in the next batch, so there's nothing to do by hand for ${inBatch === 1 ? "it" : "them"}.</p>` : "")
      + (emails.length > shownEmails.length ? `<button class="btn more-btn" data-allemails type="button">Show all ${emails.length} emails</button>` : "")
      + group(other.length === 1 ? "Other to-do overdue" : "Other to-dos overdue", other)
      : `<p class="muted nocalls">Nothing else to reach today.</p>`}</div>`;
  const sname = state.f.strategy === "none" ? "people with no strategy" : state.board.strategies.find(x => String(x.id) === state.f.strategy)?.name;
  const filteredNote = sname ? `<p class="filtered">Showing ${esc(sname)} only, so every number below counts ${list.length} of ${state.board.contacts.length} people.</p>` : "";
  if (noMatch(list)) { $("#main").innerHTML = filterBar({ stage: false, due: false }, 0) + noMatch(list); return; }
  $("#main").innerHTML = filterBar({ stage: false, due: false }, list.length) + filteredNote + strip + reachSec + (calls.length ? callSec + warmSec : warmSec + callSec);
}

// a share of contacted people; one decimal under 10% so 1 in 239 doesn't read as zero
const share = (n, of) => { if (!of) return 0; const v = 100 * n / of; return v < 10 ? Math.round(v * 10) / 10 : Math.round(v); };
const daysSince = iso => iso ? Math.round((Date.parse(today()) - Date.parse(iso.slice(0, 10))) / 864e5) : null;
function stratNumbers(id) {
  const x = state.board.stats.find(r => r.id === id) || { people: 0, contacted: 0, paid: 0, no: 0, bounced: 0, by_stage: {} };
  const stages = state.board.stages, i = stages.findIndex(s => s.name === "Interested");
  const after = stages.slice(Math.max(i, 0)).filter(s => s.kind !== "closed").map(s => s.name);
  const intr = after.reduce((n, name) => n + (x.by_stage[name] || 0), 0);
  const pct = n => share(n, x.contacted);
  return { volume: x.people, contacted: x.contacted, intr, intrPct: pct(intr), closed: x.paid, closedPct: pct(x.paid),
    dead: x.no + x.bounced, deadPct: pct(x.no + x.bounced) };
}

// step text saves itself a moment after you stop typing; drafts survive a re-render until the server has them
const pendingSaves = new Map();
state.drafts = {};
const draft = (s, k) => state.drafts[`${s.id}:${k}`] ?? s[k];
function queueSave(sid, k, value) {
  state.drafts[`${sid}:${k}`] = value;
  const p = pendingSaves.get(sid) || { body: {} };
  p.body[k] = value; clearTimeout(p.t);
  p.t = setTimeout(() => flushStep(sid), 600);
  pendingSaves.set(sid, p);
  savedNote(sid, "Saving");
}
async function flushStep(sid) {
  const p = pendingSaves.get(sid);
  if (!p) return;
  pendingSaves.delete(sid); clearTimeout(p.t);
  try {
    await api(`/api/steps/${sid}`, { method: "PATCH", body: p.body });
    for (const [k, v] of Object.entries(p.body)) if (state.drafts[`${sid}:${k}`] === v) delete state.drafts[`${sid}:${k}`];
    savedNote(sid, "Saved");
  } catch (e) { savedNote(sid, "Not saved yet. Your text is kept, type again to retry"); }
}
const flushAll = () => Promise.all([...pendingSaves.keys()].map(flushStep));
function savedNote(sid, msg) {
  const el = document.querySelector(`[data-step="${sid}"] .saved`);
  if (!el) return;
  el.textContent = msg; clearTimeout(el.t);
  if (msg === "Saved") el.t = setTimeout(() => { el.textContent = ""; }, 1500);
}

async function moveStages(ids, stage) {

  if (!people.length) return;
  const undo = [], from = new Map(people.map(c => [c.id, c.stage]));
  try {
    for (const c of people) {
      await api(`/api/contacts/${c.id}/stage`, { method: "POST", body: { stage } });
      const [ch] = await api(`/api/changes?contact=${c.id}&limit=1`).catch(() => []);
      if (ch?.can_undo) undo.push(ch.id);

  } catch (e) { if (!undo.length) return load(); }
  const n = undo.length || people.length, one = people.length === 1 ? people[0] : null;
  const who = one ? one.person || one.company : `${n} ${n === 1 ? "person" : "people"}`;
  toast(`Moved ${who} to ${stage}`, undo.length ? async () => {
    for (const h of [...undo].reverse()) await api(`/api/changes/${h}/undo`, { method: "POST" });

  state.ws = state.workspaces.some(w => w.slug === saved) ? saved : state.workspaces[0]?.slug;
  $("#ws").innerHTML = state.workspaces.map(w => `<option value="${w.slug}">${esc(w.name)}</option>`).join("");
  $("#ws").value = state.ws;
  if (state.ws) { loadPrefs(); load(); } else $("#main").innerHTML = `<div class="empty">No workspace yet. Ask Claude to set one up.</div>`;
})();
</script>
</body>
</html>
