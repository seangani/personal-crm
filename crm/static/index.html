<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom (the project's own)
 * paper: oklch(98.6% 0.004 85) · accent: oklch(48% 0.15 255) · display: system sans · body: system sans
 * nav: top bar, four tabs and one action · signature: the call list with its what-happened log · states: loading, empty, error, full
 * axes: warm paper/system/ink blue · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P3 H- E3 S3 R3 V4 · weakest: S, colour was spent on every number and pill; now colour marks only warm, paid and overdue, numbers and funnel share one panel, strategies a table */
/* Impeccable polish 10/29: mode operate · one summary panel · dates as text, overdue as the only date pill · no icons on section heads · themed scrollbars, caret, placeholder */
/* answered F7: inputs and buttons share one recipe on purpose, an input matches the button beside it (craft § 9) */
:root {
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --text-xs: 12px; --text-sm: 13px; --text-md: 15px; --text-lg: 17px; --text-xl: 20px; --text-2xl: 28px;
  --bg: oklch(98.6% 0.004 85); --panel: oklch(99.8% 0.003 85); --ink: oklch(23% 0.015 260); --muted: oklch(47% 0.015 260);
  --line: oklch(90.5% 0.006 85); --soft: oklch(95.6% 0.006 85);
  --accent: oklch(48% 0.15 255); --accent-ink: oklch(99% 0.005 255); --accent-bg: oklch(95% 0.03 255);
  --warn: oklch(52% 0.12 70); --warn-bg: oklch(95% 0.05 85); --ok: oklch(47% 0.11 160); --ok-bg: oklch(94.5% 0.04 160);
  --hot: oklch(54% 0.15 45); --hot-bg: oklch(95% 0.04 60); --dead: oklch(50% 0.17 27); --dead-bg: oklch(95.5% 0.03 25);
  --closed: oklch(55% 0.012 260); --focus: oklch(55% 0.17 255); --ai: oklch(50% 0.13 300); --ai-bg: oklch(95% 0.03 300); --st-other: oklch(52% 0.15 350);
  --scrim: oklch(15% 0.01 260 / 0.35); --shadow: 0 1px 2px oklch(15% 0.01 260 / 0.08); --shadow-lg: -8px 0 32px oklch(15% 0.01 260 / 0.18);
  --ease: 150ms ease; --container: 1200px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(18% 0.012 260); --panel: oklch(22% 0.014 260); --ink: oklch(93% 0.006 85); --muted: oklch(72% 0.012 260);
    --line: oklch(31% 0.014 260); --soft: oklch(26% 0.014 260);
    --accent: oklch(74% 0.12 255); --accent-ink: oklch(18% 0.012 260); --accent-bg: oklch(30% 0.06 255);
    --warn: oklch(82% 0.12 85); --warn-bg: oklch(31% 0.05 85); --ok: oklch(78% 0.12 160); --ok-bg: oklch(30% 0.05 160);
    --hot: oklch(78% 0.13 55); --hot-bg: oklch(31% 0.06 50); --dead: oklch(74% 0.14 25); --dead-bg: oklch(30% 0.06 25);
    --closed: oklch(66% 0.012 260); --focus: oklch(76% 0.13 255); --ai: oklch(78% 0.11 300); --ai-bg: oklch(30% 0.06 300); --st-other: oklch(76% 0.12 350);
    --scrim: oklch(5% 0.01 260 / 0.55); --shadow: 0 1px 2px oklch(5% 0.01 260 / 0.4); --shadow-lg: -8px 0 32px oklch(5% 0.01 260 / 0.5);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; }
::selection { background: var(--accent-bg); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
html { scrollbar-color: var(--line) transparent; accent-color: var(--accent); caret-color: var(--accent); }
::placeholder { color: var(--muted); opacity: 1; }
button, .btn, .card, .ov-row, .tab, .chip, .fstage, nav button, select, input, textarea { transition: background-color var(--ease), border-color var(--ease), color var(--ease); }
@media (prefers-reduced-motion: reduce) { *, .drawer, .toast { transition: none !important; } }
button, input, select, textarea { font: inherit; color: inherit; }
button:disabled, .btn:disabled, select:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
a { color: var(--accent); text-underline-offset: 0.16em; }
h1, h2, h3 { font-family: var(--font-display); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
.i { width: 16px; height: 16px; vertical-align: -3px; flex: none; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px max(20px, calc((100% - var(--container)) / 2 + 20px)); padding-top: max(12px, env(safe-area-inset-top));
  display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; }
select.ws { border: 0; background: transparent; font-weight: 650; font-size: var(--text-lg); padding: 0; cursor: pointer; }
nav { flex: none; display: flex; gap: 4px; background: var(--soft); border-radius: 8px; padding: 4px; overflow-x: auto; }
nav button { border: 0; background: transparent; padding: 4px 12px; min-height: 32px; border-radius: 4px; cursor: pointer; color: var(--muted); white-space: nowrap; }
nav button:hover { color: var(--ink); }
nav button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.grow { flex: 1; }
input.search { flex: 0 1 280px; min-width: 140px; min-height: 36px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
  min-height: 36px; padding: 4px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--dead); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: var(--text-sm); }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: var(--text-sm); }
.link:hover { text-decoration: underline; }
main { padding: 20px; max-width: var(--container); margin-inline: auto; }
.head { display: flex; align-items: baseline; gap: 8px; margin: 24px 0 8px; }
h2 { font-size: var(--text-lg); font-weight: 600; margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
.head h2 { margin: 0; font-size: var(--text-xl); font-weight: 650; }
.head .n { color: var(--muted); font-size: var(--text-md); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 12px 0; }
.empty .btn { margin-left: 8px; }
.muted { color: var(--muted); }
.co { color: var(--muted); margin-left: 8px; }
.pill { font-size: var(--text-xs); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--warn-bg); color: var(--warn); }
.pill.stuck { display: inline-flex; gap: 4px; align-items: center; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.pill.stuck .i { width: 12px; height: 12px; }
.pill.hot { background: var(--hot-bg); color: var(--hot); }
.pill.blue { background: var(--soft); color: var(--ink); }
.date { font-size: var(--text-sm); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.date.today { color: var(--ink); }
.pill.paid { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.pill.dead { background: var(--dead-bg); color: var(--dead); }
/* overview */
.section { margin-top: 40px; }
.section > .head:first-child { margin-top: 0; }
.summary { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: clip; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px; padding: 16px 20px; }
.kpi { min-width: 0; }
.kpi b { display: block; font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: var(--text-sm); }
.kpi.warm.has b { color: var(--hot); } .kpi.paid.has b { color: var(--ok); }
.funnel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(112px, 1fr); border-top: 1px solid var(--line); overflow-x: auto; }
.fstage { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 12px 20px; cursor: pointer; text-align: left; }
.fstage:first-child { border-left: 0; }
.fstage:hover { background: var(--soft); }
.fstage:active { transform: translateY(1px); }
.fstage b { display: block; font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.fstage span { font-size: var(--text-sm); color: var(--muted); }
.fstage .tag { color: var(--ok); font-weight: 600; margin-left: 4px; }
.stable td.num, .stable th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stable tr[data-strat] { cursor: pointer; } .stable tr[data-strat]:hover td { background: var(--soft); }
.stable td { vertical-align: middle; }
.strats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.scard { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.scard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scard .top b { font-size: var(--text-lg); font-weight: 600; }
.scard .rate { font-size: var(--text-2xl); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.scard dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: var(--text-sm); margin: 0; }
.scard dt { color: var(--muted); } .scard dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rows { border-top: 1px solid var(--line); }
.sbox { text-align: left; cursor: pointer; font: inherit; color: var(--ink); width: 100%; }
.sbox:hover { border-color: var(--accent); }
.sbox:active { transform: translateY(1px); }
.sbox .desc { margin: 4px 0 0; font-size: var(--text-sm); }
.sbox .sname { font-size: var(--text-lg); font-weight: 600; display: block; }
.sbox .steps-n { font-size: var(--text-xs); }
.sbox dl { margin-top: 12px; }
.newcard { display: flex; align-items: center; justify-content: center; min-height: 160px; border-style: dashed; color: var(--accent); font-weight: 600; }
.lede { margin: 4px 0 16px; max-width: 65ch; }
.note { font-size: var(--text-xs); margin: 8px 0 0; }
.seq { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.seq li { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.seq .day { color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.seq .what { display: flex; gap: 8px; align-items: center; min-width: 0; }
.seq .what .muted { font-size: var(--text-sm); }
.seq .counts { display: flex; gap: 16px; font-size: var(--text-sm); color: var(--muted); }
.seq .counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cold { color: var(--warn); font-weight: 600; }
.filtered { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--ink); font-size: var(--text-sm); }
.strip { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: baseline; padding: 4px 0 4px; }
.strip div { display: flex; gap: 8px; align-items: baseline; }
.strip b { font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.strip span { color: var(--muted); font-size: var(--text-sm); }
.strip .stuckn { display: flex; gap: 8px; align-items: baseline; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.strip .stuckn:hover span { color: var(--ink); text-decoration: underline; } .strip .stuckn.has b { color: var(--warn); }
.strip .hotn.has b { color: var(--hot); } .strip .paidn.has b { color: var(--ok); }
.ai { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; color: var(--ai); flex: none; }
.ai .i { width: 14px; height: 14px; }
.ai.batch { background: var(--ai-bg); }
.tdwho { display: inline-flex; gap: 4px; align-items: center; }
.tdstage { display: flex; flex-direction: column; gap: 4px; }
.stgd { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.card .dots { margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--text-xs); color: var(--muted); align-items: center; }
.legend > span { display: inline-flex; gap: 4px; align-items: center; }
.who { display: flex; gap: 8px; align-items: center; min-width: 0; cursor: pointer; }
.who .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who:hover b { color: var(--accent); }
.warm { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: clip; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { flex: 1; min-width: 132px; border: 0; background: transparent; padding: 12px 16px; text-align: left; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { background: var(--soft); }
.tab b { display: block; font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.tab span { font-size: var(--text-sm); color: var(--muted); }
.tab[aria-selected="true"] { border-bottom-color: var(--accent); }
.tab[aria-selected="true"] span { color: var(--ink); }
.tabpanel { padding: 4px 16px 12px; }
.tabpanel .hint { font-size: var(--text-xs); color: var(--muted); margin: 8px 0 4px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, auto); gap: 4px 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
.tabpanel .wrow:last-child { border-bottom: 0; }
.wrow, .log-list li[data-id], .nowtop { cursor: pointer; }
.wrow:hover, .log-list li[data-id]:hover { background: var(--soft); }
.wnext { justify-self: end; min-width: 0; }
.nxo { display: inline-flex; gap: 8px; align-items: center; min-width: 0; max-width: 340px; }
.nxo > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wmeta { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; padding-left: 28px; color: var(--muted); }
.wmeta .ask { color: var(--ink); }
.wrote { color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .rq { margin-top: 4px; font-size: var(--text-xs); color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.reply { border: 1px solid var(--line); background: var(--hot-bg); border-radius: 8px; padding: 8px 12px; margin: 12px 0 0; font-size: var(--text-sm); }
.reply .rh { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.reply p { margin: 4px 0 0; max-height: 240px; overflow-y: auto; overscroll-behavior: contain; }
.killrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; font-size: var(--text-sm); }
.killrow .note { flex-basis: 100%; margin: 0; }
.hacts { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 4px; color: var(--muted); }
.hacts .tel { display: inline-flex; gap: 4px; align-items: center; }
.wrow.held { opacity: 0.55; }
.tag { display: inline-flex; gap: 4px; align-items: center; font-size: var(--text-sm); padding: 2px 8px; min-height: 28px; border: 0; border-radius: 6px; background: var(--soft);
  color: var(--ink); cursor: pointer; max-width: 100%; }
.tag > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag:hover { background: var(--line); }
.tag .i { width: 14px; height: 14px; color: var(--muted); }
.tagn { color: var(--accent); font-weight: 600; margin-left: 4px; white-space: nowrap; }
.place { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: var(--text-sm); }
.place .i { width: 14px; height: 14px; }
.progress { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; font-size: var(--text-sm); }
.track { flex: 1; height: 6px; border-radius: 99px; background: var(--soft); overflow: clip; }
.obox { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px; --obar: var(--muted); }
.obox.sending { --obar: var(--accent); } .obox.done { --obar: var(--ok); } .obox.stopped { --obar: var(--dead); }
.obig { display: flex; gap: 8px; align-items: baseline; } .obig b { font-size: var(--text-2xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.obig span { color: var(--muted); }
.otrack { height: 12px; border-radius: 99px; background: var(--soft); overflow: clip; margin: 12px 0; }
.otrack i { display: block; height: 100%; background: var(--obar); transform-origin: left; transition: transform 300ms ease; }
.ostate { margin: 0; font-weight: 600; color: var(--obar); } .obox:not(.sending):not(.done):not(.stopped) .ostate { color: var(--ink); }
.ofacts { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 12px 0 0; font-size: var(--text-sm); }
.ofacts dt { color: var(--muted); font-size: var(--text-xs); } .ofacts dd { margin: 0; font-variant-numeric: tabular-nums; }
.odays { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.oday { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.oday b { display: block; font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; } .oday span { font-size: var(--text-xs); color: var(--muted); }
.oday.none b { color: var(--muted); font-weight: 500; }
.orow { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
.orow[data-id] { cursor: pointer; } .orow[data-id]:hover { background: var(--soft); }
.orow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .orow .co { margin-left: 8px; color: var(--muted); }
.orow.queued b { font-weight: 500; }
@media (max-width: 560px) { .odays { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.track i { display: block; height: 100%; background: var(--accent); transform-origin: left; transition: transform 200ms ease; }
.session { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.session > div { min-width: 0; }
.now { border: 2px solid var(--accent); border-radius: 12px; background: var(--panel); padding: 20px; }
.now h3 { font-size: var(--text-xl); font-weight: 650; display: flex; gap: 8px; align-items: center; margin: 0; }
.now .nmlink, .log-list .nmlink { font-size: inherit; color: var(--ink); font-weight: inherit; text-align: left; }
.log-list .nmlink { font-weight: 600; justify-self: start; }
.now .sub { color: var(--muted); font-size: var(--text-sm); margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.now .big { font-size: var(--text-2xl); font-weight: 650; text-decoration: none; display: inline-flex; gap: 12px; align-items: center; min-height: 48px; margin-top: 12px; }
.now .big .i { width: 24px; height: 24px; }
.points { font-size: var(--text-sm); white-space: pre-wrap; background: var(--soft); border-radius: 8px; padding: 12px; margin: 12px 0 16px; max-height: 200px; overflow: auto; }
input.callnote { width: 100%; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.go { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.go .muted { font-size: var(--text-sm); }
.chip.warmc[aria-pressed="true"] { background: var(--hot-bg); border-color: var(--hot); }
.side h3 { font-size: var(--text-md); font-weight: 600; margin: 0 0 8px; }
.next-list { list-style: none; margin: 0 0 24px; padding: 0; border-top: 1px solid var(--line); }
.next-list li { display: flex; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: var(--text-sm); min-width: 0; cursor: pointer; }
.next-list li:hover { background: var(--soft); }

<body>
<header>
  <select class="ws" id="ws" aria-label="Workspace"></select>
  <nav id="tabs">
    <button data-v="overview" class="on">Overview</button>
    <button data-v="board">Pipeline</button>
    <button data-v="all">Everyone</button>
    <button data-v="strategies">Strategies</button>
    <button data-v="outreach" hidden>Outreach today</button>
  </nav>
  <div class="grow"></div>
  <input class="search" id="q" placeholder="Search people, companies, emails" type="search">
  <button class="btn primary" id="add">Add person</button>
</header>
<main id="main"><div class="skeleton" aria-label="Loading your pipeline"><i></i><i></i><i></i><i></i></div>
<noscript><p class="empty">The CRM needs JavaScript turned on to show your pipeline.</p></noscript></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dname"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const BLANK = "__blank__";

const ICONS = {
  email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6l9 -6"/>',
  call: '<path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/>',
  text: '<path d="M8 9h8M8 13h6M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3z"/>',
  linkedin: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 11v5M8 8v.01M12 16v-5M16 16v-3a2 2 0 0 0 -4 0"/>',
  meeting: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  task: '<path d="M9 11l3 3l8 -8"/><path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9"/>',
  close: '<circle cx="12" cy="12" r="9"/><path d="M10 10l4 4m0 -4l-4 4"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2l4 -4"/>',
  hot: '<path d="M12 12c2 -2.96 0 -7 -1 -8c0 3.04 -1.77 4.74 -3 6c-1.23 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.53 -1.06 -3.94 -2 -5c-1.79 3 -2.79 3 -4 2z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  wait: '<path d="M5 12h14M13 6l6 6l-6 6"/>',
  x: '<path d="M6 6l12 12M18 6l-12 12"/>',
  ai: '<path d="M12 3l1.9 5.1l5.1 1.9l-5.1 1.9l-1.9 5.1l-1.9 -5.1l-5.1 -1.9l5.1 -1.9z"/><path d="M18 15l.8 2.2l2.2 .8l-2.2 .8l-.8 2.2l-.8 -2.2l-2.2 -.8l2.2 -.8z"/>',
  building: '<path d="M4 21v-15a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v15"/><path d="M16 9h2a2 2 0 0 1 2 2v10M3 21h18M8 8h4M8 12h4M8 16h4"/>',
  alert: '<path d="M12 4l9 16h-18z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  pin: '<path d="M12 21s-6 -5.4 -6 -10.5a6 6 0 1 1 12 0c0 5.1 -6 10.5 -6 10.5z"/><circle cx="12" cy="10.5" r="2"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.task}</svg>`;
const TYPES = { email: "Email", call: "Call", text: "Text", linkedin: "LinkedIn", meeting: "Meeting", task: "To do", close: "Close if no reply" };
const DUE = [["", "Any due date"], ["now", "Due now"], ["week", "Due within 7 days"], ["none", "No next step"], ["stuck", "Stuck over 4 days"]];
const noFilters = () => ({ stage: "", due: "", strategy: "", custom: {} });

let state = { ws: null, view: "overview", board: null, workspaces: [], f: noFilters(), sort: { key: "updated", dir: -1 },
  allEmails: false, warmTab: "close", pick: "", pickNote: "", session: null, stratOpen: null, open: new Set() };
try { state.view = localStorage.getItem("crm.view") || "overview"; state.warmTab = localStorage.getItem("crm.warmTab") || "close"; } catch (e) {}
if (state.view === "today") state.view = "overview";
const curWs = () => state.workspaces.find(w => w.slug === state.ws);
const stageInfo = () => Object.fromEntries(state.board.stages.map(s => [s.name, s]));

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json();
  if (!r.ok) { toast(data.error || "Something went wrong"); throw new Error(data.error); }
  return data;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2000); }

// filters and sort are remembered per workspace
function loadPrefs() {
  let p = {}; try { p = JSON.parse(localStorage.getItem("crm.prefs." + state.ws) || "{}"); } catch (e) {}
  state.f = { ...noFilters(), ...p.f }; state.sort = p.sort || { key: "updated", dir: -1 };
}
function savePrefs() { try { localStorage.setItem("crm.prefs." + state.ws, JSON.stringify({ f: state.f, sort: state.sort })); } catch (e) {} }

// custom fields worth a filter: ones with a handful of distinct values, like Batch
const shownFields = () => curWs().fields.filter(f => !f.hide);
function customOptions() {
  return shownFields().map(fd => ({ name: fd.name, vals: [...new Set(state.board.contacts
      .map(c => c.custom?.[fd.name]).filter(v => v != null && v !== "").map(String))].sort(nat) }))
    .filter(o => o.vals.length && o.vals.length <= 40);

// drop saved filters that no longer match anything selectable, so a hidden filter never empties the list
function cleanFilters() {
  const f = state.f;
  if (f.stage && f.stage[0] !== "@" && !state.board.stages.some(s => s.name === f.stage)) f.stage = "";
  if (f.strategy && f.strategy !== "none" && !state.board.strategies.some(s => String(s.id) === f.strategy)) f.strategy = "";
  const opts = Object.fromEntries(customOptions().map(o => [o.name, o.vals]));
  for (const [k, v] of Object.entries(f.custom)) if (v && !(opts[k] && (v === BLANK || opts[k].includes(v)))) delete f.custom[k];
}
function filtered(skipStage, skipDue) {
  const f = state.f, t = today(), week = inDays(7), st = stageInfo();
  const names = Object.fromEntries(state.board.strategies.map(s => [String(s.id), s.name]));
  return state.board.contacts.filter(c => {
    if (f.stage && !skipStage) {
      const k = st[c.stage]?.kind;
      if (f.stage === "@live") { if (!["open", "active"].includes(k)) return false; }
      else if (f.stage === "@hot") { if (!st[c.stage]?.hot) return false; }
      else if (f.stage[0] === "@") { if (k !== f.stage.slice(1)) return false; }
      else if (c.stage !== f.stage) return false;
    }
    if (f.strategy && (f.strategy === "none" ? c.strategy : c.strategy !== names[f.strategy])) return false;
    for (const [k, v] of Object.entries(f.custom)) {
      const cv = String(c.custom?.[k] ?? "");

async function logSessionCall() {

  if (!card || !state.pick) return;
  const cid = Number(card.dataset.cid), step = Number(card.dataset.step), c = state.board.contacts.find(x => x.id === cid);
  const note = $("#callNote").value.trim(), outcome = state.pick;
  $("#logNext").disabled = true;
  try {
    const r = await api(`/api/steps/${step}/done`, { method: "POST", body: { outcome, note } });
    const ses = loadSession();
    ses.log.push({ step, cid, name: c.person || c.company, outcome, note, moved: r.stage !== c.stage ? r.stage : "", email: r.after_call_step || 0 });
    ses.skipped = ses.skipped.filter(id => id !== cid);

    toast(r.stage !== c.stage ? `Logged, moved to ${r.stage}` : "Call logged");

async function undoSessionCall(step) {

const share = (n, of) => { if (!of) return 0; const v = 100 * n / of; return v < 10 ? Math.round(v * 10) / 10 : Math.round(v); };
const daysSince = iso => iso ? Math.round((Date.parse(today()) - Date.parse(iso.slice(0, 10))) / 864e5) : null;
function stratNumbers(id) {
  const x = state.board.stats.find(r => r.id === id) || { people: 0, contacted: 0, paid: 0, no: 0, bounced: 0, by_stage: {} };
  const stages = state.board.stages, i = stages.findIndex(s => s.name === "Interested");

  const intr = after.reduce((n, name) => n + (x.by_stage[name] || 0), 0);
  const pct = n => share(n, x.contacted);
  return { volume: x.people, contacted: x.contacted, intr, intrPct: pct(intr), closed: x.paid, closedPct: pct(x.paid),

function queueSave(sid, k, value) {

  const p = pendingSaves.get(sid) || { body: {} };
  p.body[k] = value; clearTimeout(p.t);

async function flushStep(sid) {

  try {
    await api(`/api/steps/${sid}`, { method: "PATCH", body: p.body });
    for (const [k, v] of Object.entries(p.body)) if (state.drafts[`${sid}:${k}`] === v) delete state.drafts[`${sid}:${k}`];

const flushAll = () => Promise.all([...pendingSaves.keys()].map(flushStep));
function savedNote(sid, msg) {

function stepBody(s, c) {

  const typeSel = `<select id="${id("type")}" data-s="type">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}"${k === s.type ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  const body = (label, cls = "", ph = "") => `${lab("body", label)}<textarea id="${id("body")}" data-s="body" class="${cls}" placeholder="${ph}">${esc(draft(s, "body"))}</textarea>`;
  let fields = "", actions = "";
  if (s.type === "email") {
    fields = `<p class="to"><span class="muted">To</span> ${c.email ? esc(c.email) : `<span class="muted">no email saved yet</span>`}</p>
      ${lab("subject", "Subject")}<input id="${id("subject")}" data-s="subject" value="${esc(draft(s, "subject"))}" placeholder="Subject">
      ${body("Message", "", "The email to send")}`;
    // an email can't be sent without an address, so the main button adds one instead
    actions = c.email ? `<button class="btn primary" data-act="done" type="button">Mark sent</button>

      : `<button class="btn primary" data-act="addemail" type="button">Add their email</button><button class="btn" data-act="copy" type="button">Copy</button>`;
  } else if (s.type === "call") {
    fields = `${phone ? `<a class="phone" href="tel:${esc(phone)}">${icon("call")}${esc(phone)}</a>` : `<p class="muted">No phone number saved. Add one with Edit details.</p>`}

      <div class="chips" role="group" aria-labelledby="${id("out")}">${CALL_LOG.map(([v, l]) =>

      ${lab("note", "Note (optional)")}<input id="${id("note")}" data-s="note" placeholder="Wants a demo Tuesday" enterkeyhint="done">`;

  } else if (s.type === "text") {
    fields = `<p class="to"><span class="muted">To</span> ${phone ? esc(phone) : `<span class="muted">no number saved</span>`}</p>${body("Message", "short")}`;
    actions = `<button class="btn primary" data-act="done" type="button">Mark sent</button>
      ${phone ? `<a class="btn" data-act="sms" href="sms:${esc(phone)}">Open Messages</a>` : ""}<button class="btn" data-act="copy" type="button">Copy</button>`;
  } else if (s.type === "linkedin") {

  } else if (s.type === "close") {

  }
  return `${fields}
    <div class="acts row">${s.status === "paused" ? `<button class="btn primary" data-act="resume" type="button">Resume</button>` : actions}
      <span class="saved" aria-live="polite"></span></div>

      <div class="grid2"><div>${lab("type", "Type")}${typeSel}</div><div>${lab("due", "Due")}<input type="date" id="${id("due")}" data-s="due" value="${esc(draft(s, "due") || "")}"></div></div>
      ${lab("title", "Step name")}<input id="${id("title")}" data-s="title" value="${esc(draft(s, "title"))}" placeholder="${esc(TYPES[s.type])}">
      <div class="row">${s.status === "paused" ? "" : `<button class="btn sm" data-act="skip" type="button">Skip this step</button>`}
        <button class="btn sm danger" data-act="remove" type="button">Remove step</button></div></details>`;
}
function stepLabel(s) { return s.title || (s.type === "email" && s.subject ? `Email: ${s.subject}` : TYPES[s.type]); }

      toast(r.stage !== c.stage ? `${msg}, moved to ${r.stage}` : msg); refresh(id);
    };
    card.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
      const act = b.dataset.act;
      if (act === "outlook") {  // the Outlook app on the Mac; on the phone, the phone's mail app

        const mail = { to: c.email, subject: val("subject"), body: val("body") };
        const r = await api("/api/compose", { method: "POST", body: mail }).catch(() => ({}));
        if (r.opened) toast("Opened in Outlook. Come back and tap Mark sent once it's gone");
        else location.href = `mailto:${mail.to}?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body)}`;
      }
      else if (act === "copy") { const text = s.type === "email" ? `${val("subject")}\n\n${val("body")}`.trim() : val("body"); await navigator.clipboard.writeText(text); toast("Copied"); }
      else if (act === "sms") flushStep(sid);
      else if (act === "addemail") showDetails(true, "e-email");
      else if (act === "done") await finish("", "", s.type === "close" ? "Closed" : s.type === "email" ? "Marked sent" : "Done");
      else if (act === "logcall") {
        if (!outcome) { toast("Pick what happened first"); return card.querySelector(".chip").focus(); }
        await finish(outcome, val("note").trim(), "Call logged");

      else if (act === "resume") { await flushStep(sid); await api(`/api/steps/${sid}`, { method: "PATCH", body: { status: "planned" } }); toast("Resumed"); refresh(id); }
      else if (act === "skip") { if (!confirm("Skip this step? It moves to done as skipped and the next one becomes current.")) return;
        await flushStep(sid); await api(`/api/steps/${sid}/skip`, { method: "POST" }); state.open.delete(sid); toast("Skipped"); refresh(id); }
      else if (act === "remove") { if (!confirm("Remove this planned step?")) return; pendingSaves.delete(sid); await api(`/api/steps/${sid}`, { method: "DELETE" }); toast("Removed"); refresh(id); }
    });
  });

  const go = e.target.closest("[data-stagego]");
  if (go) { state.f = { ...noFilters(), stage: go.dataset.stagego }; state.view = "all"; savePrefs(); return render(); }
  if (e.target.closest("[data-stuckgo]")) { state.f = { ...noFilters(), due: "stuck" }; state.view = "all"; savePrefs(); try { localStorage.setItem("crm.view", state.view); } catch (e) {} return render(); }
  const el = !e.target.closest("select, input, textarea, button") && e.target.closest("[data-id]");
  if (el && !e.target.closest(".drawer")) return openContact(el.dataset.id);
  const tab = e.target.closest("#tabs button");
  if (tab) { state.view = tab.dataset.v; state.stratOpen = null; try { localStorage.setItem("crm.view", state.view); } catch (e) {} return render(); }
  if (e.target.id === "retry") return load();
  if (e.target.id === "clearF") { state.f = noFilters(); savePrefs(); return render(); }
  const th = e.target.closest("th[data-sort]");
  if (th) { const k = th.dataset.sort; state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "updated" ? -1 : 1 }; savePrefs(); return render(); }
  // strategies: open a box, go back, edit
  const box = e.target.closest("[data-strat]");
  if (box) { state.view = "strategies"; state.stratOpen = Number(box.dataset.strat); try { localStorage.setItem("crm.view", state.view); } catch (e) {} return render(); }
  if (e.target.closest("[data-stratedit]")) {
    $("#stratEdit").innerHTML = stratCard(state.board.strategies.find(s => s.id === state.stratOpen));
    return $("#stratEdit .name").focus();
  }
  const card = e.target.closest(".strat");
  if (e.target.id === "newStrat") { state.stratOpen = "new"; return render(); }
  if (e.target.id === "acSave") {
    const w = await api(`/api/workspaces/${state.ws}/after-call`, { method: "PUT", body: { subject: $("#acSubject").value, body: $("#acBody").value } });
    curWs().after_call = w.after_call; return toast("Template saved");
  }
  else if (card && e.target.closest("[data-addstep]")) {
    const last = [...card.querySelectorAll('[data-k="day"]')].pop();
    card.querySelector(".ssteps").insertAdjacentHTML("beforeend", stratStep({ type: "call", day: (Number(last?.value) || 0) + 2 }));
  }
  else if (card && e.target.closest("[data-rm]")) e.target.closest(".srow").remove();
  else if (card && e.target.closest("[data-savestrat]")) {
    const s = readStrat(card);
    if (!s.name) return toast("Give the strategy a name");
    if (!s.steps.length) return toast("Add at least one step");
    const saved = await api("/api/strategies", { method: "POST", body: s }); toast("Strategy saved");
    state.stratOpen = saved.id; load();
  }
  else if (card && e.target.closest("[data-delstrat]")) {
    if (!confirm("Delete this strategy? No one follows it, so nothing else changes.")) return;
    await api(`/api/strategies/${card.dataset.sid}`, { method: "DELETE" }); toast("Strategy deleted"); state.stratOpen = null; load();
  }
});
document.addEventListener("input", e => { if (e.target.id === "callNote") state.pickNote = e.target.value; });
document.addEventListener("change", e => {
  if (e.target.id === "stratPick") { const v = e.target.value; state.stratOpen = v === "new" ? "new" : v ? Number(v) : null; return render(); }
  const k = e.target.dataset?.f;
  if (k) { if (k.startsWith("c:")) state.f.custom[k.slice(2)] = e.target.value; else state.f[k] = e.target.value; savePrefs(); return render(); }
  if (e.target.closest(".srow") && e.target.dataset.k === "type") {  // show the subject box only for emails
    const r = e.target.closest(".srow"), email = e.target.value === "email";
    r.querySelector('[data-k="subject"]').hidden = !email;
    r.querySelector('[data-k="body"]').placeholder = email ? "Message template (optional)" : "Notes or talking points (optional)";
  }
});
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "Enter" && e.target.id === "callNote") logSessionCall();
  const tabs = e.target.closest('[role="tablist"]');
  if (tabs && ["ArrowRight", "ArrowLeft"].includes(e.key)) {  // arrow keys move between the warm tabs
    const all = [...tabs.querySelectorAll("[data-warmtab]")], i = all.findIndex(b => b.getAttribute("aria-selected") === "true");
    all[(i + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length].click();
  }
});
$("#add").onclick = addForm;
let timer; $("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 200); };
$("#ws").onchange = e => { state.ws = e.target.value; try { localStorage.setItem("crm.ws", state.ws); } catch (e) {} loadPrefs(); load(); };
// keep the page current when Claude changes things through MCP or the CLI: check on focus, when the tab comes back,
// and every 30 seconds. Never while you're typing, mid-call or editing a strategy, and only redraw when something changed.
const typing = () => document.activeElement?.matches("input:not(#q):not([type=date]), textarea, [contenteditable]");
const busy = () => typing() || state.pick || state.view === "strategies" || pendingSaves.size;
async function autoRefresh() {
  if (document.hidden || !state.ws || !state.board || busy()) return;
  if (state.view === "outreach" && !$("#drawer").classList.contains("open")) {
    let o; try { o = await api("/api/outreach-today"); } catch (e) { return; }
    if (JSON.stringify(o) !== state.outreachKey) { state.outreach = o; state.outreachKey = JSON.stringify(o); renderOutreach(o); }
    return;
  }
  const q = encodeURIComponent($("#q").value.trim());
  let b; try { const r = await fetch(`/api/board?workspace=${state.ws}&q=${q}`); if (!r.ok) return; b = await r.json(); } catch (e) { return; }
  const s = JSON.stringify(b);
  if (s === lastBoard || busy()) return;
  state.board = b; lastBoard = s;
  const y = window.scrollY; render(); window.scrollTo(0, y);
  // the open panel follows too, unless something in it is half done
  const d = $("#drawer");
  if (state.openFor && d.classList.contains("open") && d.querySelector("#hold") && !$("#saveDetails") && !$("#summary")?.value.trim()) openContact(state.openFor);
}
window.addEventListener("focus", autoRefresh);
document.addEventListener("visibilitychange", autoRefresh);
setInterval(autoRefresh, 30000);

(async () => {
  state.workspaces = await api("/api/workspaces");
  let saved; try { saved = localStorage.getItem("crm.ws"); } catch (e) {}
  state.ws = state.workspaces.some(w => w.slug === saved) ? saved : state.workspaces[0]?.slug;
  $("#ws").innerHTML = state.workspaces.map(w => `<option value="${w.slug}">${esc(w.name)}</option>`).join("");
  $("#ws").value = state.ws;
  if (state.ws) { loadPrefs(); load(); } else $("#main").innerHTML = `<div class="empty">No workspace yet. Ask Claude to set one up.</div>`;
})();
</script>
</body>
